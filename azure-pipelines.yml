trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'My-Azure-Service-Connection' # replace with your service connection name
  webAppName: 'DHCW-TestTools-App'                         # replace with your App Service name

stages:
- stage: Build
  displayName: Build and Test
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - script: dotnet restore TestTools.sln
      displayName: 'dotnet restore'

    - script: dotnet build TestTools.sln --configuration $(buildConfiguration) --no-restore
      displayName: 'dotnet build'

    - script: |
        dotnet test TestTools.Tests/TestTools.Tests.csproj --configuration $(buildConfiguration) --no-build --logger trx
      displayName: 'dotnet test'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: PushChanges
  displayName: Push repository changes
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Push
    displayName: Commit and push changes back to repo
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none

    - bash: |
        set -euo pipefail
        echo "## cloning repository using OAUTH token"
        git clone "https://$(System.AccessToken)@dev.azure.com/DHCW-ADS/_git/MCP-AI-POC" repo
        cd repo
        git fetch origin main
        remote_msg=$(git log -1 origin/main --pretty=%B || true)
        if echo "$remote_msg" | grep -q "chore: repository updates from pipeline"; then
          echo "Remote already updated by pipeline; skipping commit"
          exit 0
        fi
        echo "Copying workspace files into repo..."
        cp -a ../. ./
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git config user.email "buildagent@example.com"
          git config user.name "AzurePipelines"
          git commit -m "chore: repository updates from pipeline"
          git push "https://$(System.AccessToken)@dev.azure.com/DHCW-ADS/_git/MCP-AI-POC" HEAD:main
        fi
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: 'Clone, commit & push changes (if any)'


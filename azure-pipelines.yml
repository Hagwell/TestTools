trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'My-Azure-Service-Connection' # replace with your service connection name
  webAppName: 'DHCW-TestTools-App'                         # replace with your App Service name

stages:
- stage: Build
  displayName: Build and Test
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - script: dotnet restore TestTools.sln
      displayName: 'dotnet restore'

    - script: dotnet build TestTools.sln --configuration $(buildConfiguration) --no-restore
      displayName: 'dotnet build'

    - script: |
        dotnet test TestTools.Tests/TestTools.Tests.csproj --configuration $(buildConfiguration) --no-build --logger trx
      displayName: 'dotnet test'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: Publish & Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWeb
    displayName: Deploy to Azure App Service
    environment: 'staging'
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK (deploy)'
            inputs:
              packageType: 'sdk'
              version: '8.0.x'

          - script: dotnet publish TestTools/TestTools.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/publish
            displayName: 'dotnet publish'

          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webApp'
              appName: '$(webAppName)'
              package: '$(Build.ArtifactStagingDirectory)/publish'
